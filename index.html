<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071b33">
  <title>DestyPoint — Din AI-baserade resebyrå</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <section class="splash" id="splash">
      <div class="splash-glow"></div>
      <div class="splash-brand">
        <div class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 100 100" role="img"><circle cx="50" cy="50" r="36"/><circle cx="50" cy="50" r="25"/><path d="M62 25 55 45 75 38 56 56 45 78 46 56 26 62 44 48Z"/></svg>
        </div>
        <div class="brand-title">DestyPoint</div>
        <div class="brand-tagline">Din AI-baserade resebyrå</div>
      </div>

      <div class="splash-bottom">
        <div class="mini-label">BÖRJA HÄR</div>
        <h1>Berätta vart du vill.</h1>
        <p>Din resa börjar med några egna ord.</p>
        <div class="splash-input-wrap">
          <label for="destination">🌍 Beskriv din resa</label>
          <textarea id="destination" rows="4" placeholder="Exempel: Helsingborg, 2 personer, hotell och tåg från Flen. Gärna något trevligt att göra."></textarea>
          <div class="date-row">
            <label>Från<input id="from" type="date"></label>
            <label>Till<input id="to" type="date"></label>
          </div>
          <button id="go" class="gold-button" type="button">Skapa min resa <span>✦</span></button>
        </div>
        <div class="privacy-note">Du bestämmer själv vad DestyPoint ska ta hänsyn till.</div>
      </div>
    </section>

    <main class="results-app" id="resultsApp">
      <header class="app-header">
        <button class="icon-button" id="backToStart" aria-label="Tillbaka">‹</button>
        <div class="header-brand"><span class="header-symbol">✧</span><span>DestyPoint</span></div>
        <button class="icon-button" aria-label="Meny">⋯</button>
      </header>
      <div class="results-inner">
        <div class="hello-row">
          <div>
            <div class="small-gold">DIN AI-RESEBYRÅ</div>
            <h2>Din resa</h2>
          </div>
          <div class="header-avatar">✦</div>
        </div>
        <div id="out"></div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
