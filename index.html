<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResAgent v1.1</title><link rel="stylesheet" href="style.css"></head><body><header>✈️ ResAgent <span>v1.1</span></header><main><p class="eyebrow">DIN PERSONLIGA AI-RESEAGENT</p><h1>Berätta vart du vill.</h1><p class="lead">Beskriv din resa, destination, aktiviteter, budget och vad som är viktigt för dig.</p><section class="card"><label for="destination">✍️ Beskriv din resa</label><textarea id="destination">Vi är tre personer och vill resa till Grekland.</textarea><div class="grid"><div><label>Från</label><input id="from" type="date" value="2026-12-12"></div><div><label>Till</label><input id="to" type="date" value="2026-12-25"></div></div><div class="grid"><div><label>👨‍👩‍👧‍👦 Resenärer</label><input id="people" type="number" value="3" min="1"></div><div><label>💰 Totalbudget (kr)</label><input id="budget" type="number" value="11000" step="500"></div></div><label>Vad är viktigast?</label><div id="chips" class="chips"><button class="active" data-v="sol">☀️ Sol & bad</button><button class="active" data-v="familj">👨‍👩‍👧‍👦 Familj</button><button class="active" data-v="budget">💰 Budget</button><button data-v="kultur">🏛️ Kultur</button><button data-v="natur">🌲 Natur</button><button data-v="kort">✈️ Kort restid</button></div><button id="go">🧠 Starta ResAgent</button><small>v1.1 är fortfarande en prototyp. Priser och länkar behöver verifieras innan bokning.</small></section><section id="out"></section></main><script src="app.js"></script></body></html>
