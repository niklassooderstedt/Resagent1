<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061b31">
<title>DestyPoint v1.9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <div class="contour contour-a"></div><div class="contour contour-b"></div><div class="contour contour-c"></div>
  <main class="home">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="43"></circle><circle cx="60" cy="60" r="31"></circle>
          <path d="M60 4v21M60 95v21M4 60h21M95 60h21"></path>
          <path class="plane" d="M42 67L82 43 66 77 58 61 42 67Z"></path>
          <path class="plane-line" d="M58 61l11-9"></path>
        </svg>
      </div>
      <div class="brand-name">DestyPoint</div>
      <div class="brand-tagline">Din AI-baserade resebyrå</div>
    </header>

    <section class="intro">
      <div class="eyebrow">BÖRJA HÄR</div>
      <h1>Berätta vart du vill.</h1>
      <p>Din resa börjar med några egna ord.</p>
    </section>

    <section class="travel-prompt" aria-label="Beskriv din resa">
      <div class="prompt-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40"><path d="M20 36s11-10.7 11-20A11 11 0 1 0 9 16c0 9.3 11 20 11 20Z"></path><circle cx="20" cy="16" r="3.5"></circle></svg>
      </div>
      <div class="prompt-copy">
        <input id="destination" autocomplete="off" placeholder="Beskriv din resa..." aria-label="Beskriv din resa">
        <div class="prompt-example">t.ex. destination, personer, hotell, transport</div>
      </div>
      <button id="spark" class="spark" type="button" aria-label="Skapa resa">✦</button>
    </section>

    <section class="inspiration" aria-label="Inspiration">
      <div class="section-heading"><span></span><h2>ELLER HÄMTA INSPIRATION</h2><span></span></div>
      <div class="inspiration-grid">
        <button class="idea" data-idea="En weekendresa för 2 personer med hotell och trevliga upplevelser.">
          <svg viewBox="0 0 80 80" class="idea-icon"><path d="M18 31h44v30H18zM25 31V23h30v8M31 41h18M27 51h26"></path><path d="M27 61v7M53 61v7"></path></svg><span>Weekend</span>
        </button>
        <button class="idea" data-idea="En roadtrip för 2 personer med fina stopp, bra mat och upplevelser längs vägen.">
          <svg viewBox="0 0 80 80" class="idea-icon"><path d="M16 51l7-24h34l7 24v9H16zM23 27l5-10h24l5 10M25 51h30M25 60v7M55 60v7"></path><circle cx="25" cy="51" r="4"></circle><circle cx="55" cy="51" r="4"></circle></svg><span>Roadtrip</span>
        </button>
        <button class="idea" data-idea="En resa för 2 personer med sol, bad, god mat och avkoppling.">
          <svg viewBox="0 0 80 80" class="idea-icon"><path d="M22 52c4-15 18-23 31-20 8 2 14 8 16 20M12 57h56M20 63h40"></path><path d="M34 52c-5-8-5-18-1-27M42 52c5-8 5-18 1-27M50 52c8-6 13-13 13-20"></path></svg><span>Sol &amp; bad</span>
        </button>
        <button class="idea" data-idea="En natur- och äventyrsresa för 2 personer med vandring och fina naturupplevelser.">
          <svg viewBox="0 0 80 80" class="idea-icon"><path d="M12 62L35 25l10 16 7-10 16 31H12Z"></path><path d="M48 62l11-21 9 21M28 62l7-12 7 12"></path></svg><span>Natur &amp; äventyr</span>
        </button>
      </div>
    </section>

    <section class="destination-art" aria-hidden="true">
      <svg viewBox="0 0 1000 210" preserveAspectRatio="none">
        <path class="art-line" d="M0 155 C90 120 125 128 195 155 S325 177 390 146 S520 132 585 156 S720 180 810 150 S910 126 1000 146"></path>
        <path class="art-line" d="M110 158c18-29 48-29 68 0M155 158c18-23 42-23 58 0"></path>
        <path class="art-line" d="M760 157c12-31 32-50 47-65 13 17 22 38 25 65M778 114c-13-17-27-24-40-24M794 106c15-18 29-25 43-25"></path>
        <path class="art-line plane-path" d="M390 116 C420 86 445 94 469 112"></path>
        <path class="art-plane" d="M465 109l35-22-14 27-13-4-8 11z"></path>
        <path class="art-line" d="M0 170H1000"></path>
      </svg>
    </section>

    <section id="out" class="results" aria-live="polite"></section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
