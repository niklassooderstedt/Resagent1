<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ResAgent v1.4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <b>✈️ ResAgent</b>
    <span>v1.4</span>
  </header>

  <main>
    <p class="eyebrow">DIN PERSONLIGA AI-RESEAGENT</p>
    <h1>Berätta vart du vill.</h1>
    <p class="lead">Beskriv din resa, destination, aktiviteter, budget och vad som är viktigt för dig.</p>

    <section class="card">
      <label for="destination">🌍 Beskriv din resa</label>
      <textarea id="destination" rows="5" placeholder="Exempel: Vi är två vuxna och två barn från Katrineholm och vill åka till Göteborg en weekend i oktober. Vi vill gå på Liseberg, bo på ett bra hotell och hålla oss under 8 000 kr. Kort restid är viktigt."></textarea>

      <div class="grid">
        <div>
          <label for="from">Från</label>
          <input id="from" type="date">
        </div>
        <div>
          <label for="to">Till</label>
          <input id="to" type="date">
        </div>
      </div>

      <button id="go" class="primary" type="button">🧠 Starta ResAgent</button>
      <small>v1.4 tolkar antal resenärer, budget, destination, resetyp och prioriteringar från din beskrivning.</small>
    </section>

    <section id="out"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
