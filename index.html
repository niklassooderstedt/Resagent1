<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071a31">
  <title>DestyPoint — Din AI-baserade resebyrå</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">✈️</span>
        <div>
          <div class="brand-name">DestyPoint</div>
          <div class="brand-subtitle">Din AI-baserade resebyrå</div>
        </div>
      </div>
      <span class="version">v1.5</span>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">DIN PERSONLIGA AI-RESEBYRÅ</p>
        <h1>Berätta vart du vill.</h1>
        <p class="lead">Beskriv din resa, destination, aktiviteter, budget etc.</p>

        <section class="planner-card">
          <label for="destination">🌍 Beskriv din resa</label>
          <textarea id="destination" rows="5" placeholder="Exempel: Helsingborg, hotell, tåg från Flen, 2 personer, en dag. Budget 3 000 kr."></textarea>

          <div class="date-grid">
            <div>
              <label for="from">Från</label>
              <input id="from" type="date">
            </div>
            <div>
              <label for="to">Till</label>
              <input id="to" type="date">
            </div>
          </div>

          <button id="go" class="primary" type="button">✨ Skapa min resa</button>
        </section>
      </section>

      <section id="out"></section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
