<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071a31">
  <title>DestyPoint v1.5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✈️</span>
      <div>
        <div class="brand-name">DestyPoint</div>
        <div class="brand-subtitle">Din AI-baserade resebyrå</div>
      </div>
    </div>
    <span class="version">v1.5</span>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">DIN PERSONLIGA AI-RESEBYRÅ</p>
      <h1>Berätta vart du vill.</h1>
      <p class="lead">Beskriv din resa, destination, aktiviteter, budget etc.</p>

      <section class="planner-card">
        <label for="destination">🌍 Beskriv din resa</label>
        <textarea id="destination" rows="6"
          placeholder="Exempel: Göteborg, 2 vuxna och 1 barn, hotell, transport från Flen, 2 dagar. Vi vill gå på Liseberg och hålla oss under 8 000 kr."></textarea>

        <div class="grid">
          <div>
            <label for="from">Från</label>
            <input id="from" type="date">
          </div>
          <div>
            <label for="to">Till</label>
            <input id="to" type="date">
          </div>
        </div>

        <button id="go" class="primary" type="button">🧠 Skapa min resa</button>
        <small>Beskriv så mycket eller lite du vill. DestyPoint tolkar destination, personer, budget, transport, aktiviteter och önskemål från din text.</small>
      </section>
    </section>

    <section id="out"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
