<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172b4d">
  <title>ResAgent v1.2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">✈️ <span>ResAgent</span></div>
    <div class="version">v1.2</div>
  </header>

  <main class="page">
    <div class="eyebrow">DIN PERSONLIGA AI-RESEAGENT</div>
    <h1>Berätta vart du vill.</h1>
    <p class="lead">Beskriv din resa, destination, aktiviteter, budget och vad som är viktigt för dig.</p>

    <section class="card">
      <h2>✍️ Beskriv din resa</h2>
      <textarea id="destination" placeholder="Exempel: Vi är tre personer och vill resa till Grekland.">Vi är tre personer och vill resa till Grekland.</textarea>

      <div class="grid">
        <label>Från
          <input id="from" type="date" value="2026-12-12">
        </label>
        <label>Till
          <input id="to" type="date" value="2026-12-25">
        </label>
      </div>

      <div class="grid">
        <label>👨‍👩‍👧 Resenärer
          <input id="people" type="number" min="1" value="3">
        </label>
        <label>💰 Totalbudget (kr)
          <input id="budget" type="number" min="0" value="11000">
        </label>
      </div>

      <h2 class="small-heading">Vad är viktigast?</h2>
      <div id="chips" class="chips">
        <button type="button" data-v="Sol & bad">☀️ Sol & bad</button>
        <button type="button" data-v="Familj">👨‍👩‍👧 Familj</button>
        <button type="button" data-v="Budget">💰 Budget</button>
        <button type="button" data-v="Kultur">🏛️ Kultur</button>
        <button type="button" data-v="Natur">🌲 Natur</button>
        <button type="button" data-v="Kort restid">✈️ Kort restid</button>
      </div>

      <button id="go" class="primary" type="button">🧠 Starta ResAgent</button>
    </section>

    <section id="out" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
