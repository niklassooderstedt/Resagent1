<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResAgent v1.0</title><link rel="stylesheet" href="style.css"></head><body><header><b>✈️ ResAgent</b><span>v1.0</span></header><main><section class="hero"><p class="eyebrow">DIN PERSONLIGA AI-RESEAGENT</p><h1>Berätta vart du vill.</h1><p class="lead">Jag väger destination, budget, resenärer, restid och prioriteringar mot varandra.</p></section><section class="card"><label for="destination">🌍 Vart vill ni åka?</label><input id="destination" value="Frankfurt" placeholder="Japan, Kinamuren, New York..."><div class="grid"><div><label for="from">Från</label><input id="from" type="date" value="2026-12-12"></div><div><label for="to">Till</label><input id="to" type="date" value="2026-12-25"></div></div><div class="grid"><div><label for="people">👨‍👩‍👧‍👦 Resenärer</label><input id="people" type="number" value="3" min="1"></div><div><label for="budget">💰 Totalbudget (kr)</label><input id="budget" type="number" value="11000" min="0" step="500"></div></div><label>Vad är viktigast?</label><div id="chips" class="chips"><button type="button" class="active" data-v="sol">☀️ Sol & bad</button><button type="button" class="active" data-v="familj">👨‍👩‍👧‍👦 Familj</button><button type="button" class="active" data-v="budget">💰 Budget</button><button type="button" data-v="kultur">🏛️ Kultur</button><button type="button" data-v="natur">🌲 Natur</button><button type="button" data-v="kort">✈️ Kort restid</button></div><button id="go" class="primary" type="button">🧠 Starta ResAgent</button><small>v1.0 använder simulerad reseanalys. Inga riktiga bokningar görs.</small></section><section id="out"></section></main><script src="app.js"></script></body></html>
