<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071b31">
  <title>DestyPoint v1.7</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="brand">
      <div class="compass" aria-hidden="true">
        <span class="cross"></span><span class="plane">✦</span>
      </div>
      <div class="brand-name">DestyPoint</div>
      <div class="tagline">Din AI-baserade resebyrå</div>
    </header>

    <section class="intro">
      <div class="eyebrow">BÖRJA HÄR</div>
      <h1>Berätta vart du vill.</h1>
      <p>Din resa börjar med några egna ord.</p>
    </section>

    <section class="trip-card">
      <div class="field-title"><span>🌍</span> Beskriv din resa</div>

      <div class="prompt-wrap">
        <textarea id="destination" aria-label="Beskriv din resa"
          placeholder="Exempel: Helsingborg, 2 personer, hotell och tåg från Flen. Gärna något trevligt att göra."></textarea>
        <button id="go" class="sparkle" aria-label="Skapa min resa">✦</button>
      </div>

      <div class="date-grid">
        <label>Från<input id="from" type="date"></label>
        <label>Till<input id="to" type="date"></label>
      </div>
    </section>

    <section class="inspiration">
      <div class="divider-title"><span></span><b>ELLER HÄMTA INSPIRATION</b><span></span></div>
      <div class="inspiration-grid">
        <button class="idea" data-idea="Weekendresa för 2 personer, hotell och trevliga restauranger."><span class="icon">▣</span><span>Weekend</span></button>
        <button class="idea" data-idea="Roadtrip för 2 personer med fina stopp, natur och bra mat."><span class="icon">▱</span><span>Roadtrip</span></button>
        <button class="idea" data-idea="Sol och bad, hotell nära stranden och lugna aktiviteter."><span class="icon">☼</span><span>Sol &amp; bad</span></button>
        <button class="idea" data-idea="Natur och äventyr för 2 personer, boende och aktiviteter."><span class="icon">△</span><span>Natur &amp; äventyr</span></button>
      </div>
    </section>

    <section id="out" class="results"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
