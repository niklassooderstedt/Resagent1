<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061b31">
  <title>DestyPoint v2.6</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <div class="topo topo-left" aria-hidden="true"></div>
      <div class="topo topo-right" aria-hidden="true"></div>
      <div class="route route-top" aria-hidden="true"></div>

      <div class="brand-mark" aria-label="DestyPoint">
        <svg viewBox="0 0 120 120" role="img" aria-hidden="true">
          <circle cx="60" cy="60" r="37" class="gold-stroke"/>
          <line x1="60" y1="4" x2="60" y2="22" class="gold-stroke"/>
          <line x1="60" y1="98" x2="60" y2="116" class="gold-stroke"/>
          <line x1="4" y1="60" x2="22" y2="60" class="gold-stroke"/>
          <line x1="98" y1="60" x2="116" y2="60" class="gold-stroke"/>
          <path d="M40 69 L82 39 L66 68 L58 61 Z" class="gold-fill"/>
          <path d="M58 61 L69 78 L67 62 Z" class="gold-fill"/>
        </svg>
      </div>
      <h1>DestyPoint</h1>
      <p class="tagline">Din AI-baserade resebyrå</p>

      <section class="planner" aria-label="Skapa resa">
        <label class="sr-only" for="destination">Beskriv din resa</label>
        <div class="description-field">
          <span class="location-icon" aria-hidden="true">
            <svg viewBox="0 0 48 56">
              <path d="M24 53S7 35 7 22a17 17 0 1 1 34 0C41 35 24 53 24 53Z" fill="none" stroke="currentColor" stroke-width="3.5"/>
              <circle cx="24" cy="22" r="5" fill="none" stroke="currentColor" stroke-width="3.5"/>
            </svg>
          </span>
          <div class="description-copy">
            <input id="destination" type="text" autocomplete="off" placeholder="Beskriv din resa…" aria-label="Beskriv din resa">
            <span>t.ex. destination, personer, hotell, transport</span>
          </div>
        </div>

        <div class="date-row">
          <div class="date-group">
            <label class="date-label" for="from">Från</label>
            <div class="date-field">
              <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="10" width="34" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="3"/><path d="M7 19h34M14 6v9M34 6v9" fill="none" stroke="currentColor" stroke-width="3"/></svg>
              <input id="from" type="date" aria-label="Från datum">
            </div>
          </div>
          <div class="date-group">
            <label class="date-label" for="to">Till</label>
            <div class="date-field">
              <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="10" width="34" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="3"/><path d="M7 19h34M14 6v9M34 6v9" fill="none" stroke="currentColor" stroke-width="3"/></svg>
              <input id="to" type="date" aria-label="Till datum">
            </div>
          </div>
        </div>

        <button id="go" class="primary">Skapa min resa <span>✦</span></button>
      </section>

      <section class="inspiration" aria-label="Inspiration">
        <div class="section-heading">
          <span></span>
          <h2>ELLER HÄMTA INSPIRATION</h2>
          <span></span>
        </div>

        <div class="inspiration-grid">
          <button class="inspiration-card" data-prompt="En weekendresa för två med hotell och trevliga upplevelser.">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <rect x="17" y="18" width="30" height="38" rx="4" fill="none" stroke="currentColor" stroke-width="2.7"/>
              <path d="M25 18v-6h14v6M32 18v38M17 29h30M29 25h6" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Weekend</span>
          </button>

          <button class="inspiration-card" data-prompt="En roadtrip med fina stopp, bra mat och sevärdheter.">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M9 43h46l-5-18H14z" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linejoin="round"/>
              <path d="M17 25l6-10h18l6 10M23 29h18M18 36h7M39 36h7" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round"/>
              <circle cx="19" cy="45" r="4" fill="none" stroke="currentColor" stroke-width="2.7"/>
              <circle cx="45" cy="45" r="4" fill="none" stroke="currentColor" stroke-width="2.7"/>
            </svg>
            <span>Roadtrip</span>
          </button>

          <button class="inspiration-card" data-prompt="En resa med sol, bad, strand och avkoppling.">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M32 46V29M32 32C25 26 19 27 15 22M32 34C39 28 45 29 49 24M32 38C25 33 20 34 17 31M32 39C39 34 44 35 48 31" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
              <path d="M31 29c-2-9-7-14-13-16M33 29c2-9 7-14 13-16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
              <path d="M20 49h24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
            </svg>
            <span>Sol &amp; bad</span>
          </button>

          <button class="inspiration-card" data-prompt="En natur- och äventyrsresa med vandring och vackra landskap.">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M8 50L25 24l8 11 8-16 15 31H8Z" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linejoin="round"/>
              <path d="M25 24l5 8-5 7-5-7zM41 19l5 9-5 8-5-8z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/>
            </svg>
            <span>Natur &amp;<br>äventyr</span>
          </button>
        </div>
      </section>

      <div class="landscape" aria-hidden="true">
        <svg viewBox="0 0 900 260" preserveAspectRatio="none">
          <path d="M0 198 C110 176 160 207 260 181 C350 158 415 201 505 173 C600 144 640 178 720 156 C785 139 835 169 900 150" class="land-line"/>
          <path d="M0 222 C110 214 175 230 280 210 C370 192 455 232 540 207 C650 177 735 222 900 196" class="land-line"/>
          <path d="M0 154 C55 108 101 112 146 153" class="land-line"/>
          <circle cx="90" cy="150" r="34" class="sun"/>
          <path d="M52 150h76M64 165h52M72 180h36" class="land-line"/>
          <path d="M380 145 C365 105 404 83 430 96 C447 105 455 91 470 84" class="route-line"/>
          <path d="M426 86 l28 -14 -13 20 15 7 -31 4z" class="gold-fill"/>
          <path d="M485 188 L545 121 582 155 628 101 695 188" class="land-line"/>
          <path d="M515 188 L560 139 582 159 620 119 667 188" class="land-line"/>
          <path d="M765 190 C759 145 768 115 793 89" class="land-line"/>
          <path d="M790 92 C774 76 764 67 756 57M792 98 C809 81 821 74 835 70M789 95 C789 75 790 63 797 50" class="land-line"/>
          <path d="M756 190h80" class="land-line"/>
        </svg>
      </div>

      <footer>DestyPoint v2.6</footer>
    </section>

    <section id="out" class="results" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
